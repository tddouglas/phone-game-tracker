<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Tints Safari's toolbar / status bar to match the page; keep in sync with --surface in style.css -->
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tentacruel</title>
<!-- Link previews (iMessage, Slack, etc.) read these from the static HTML; they don't run app.js -->
<meta name="description" content="Daily game scoreboard. Scores, streaks and who missed what.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tentacruel">
<meta property="og:title" content="Tentacruel">
<meta property="og:description" content="Daily game scoreboard. Scores, streaks and who missed what.">
<meta property="og:image" content="https://phone-game-tracker.vercel.app/og.png">
<meta property="og:url" content="https://phone-game-tracker.vercel.app/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tentacruel daily game scoreboard">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" id="brand">Game Chat</a>
    <nav id="nav">
      <a href="#/" data-v="">Day</a>
      <a href="#/games" data-v="games">Games</a>
      <a href="#/players" data-v="players">Players</a>
    </nav>
    <div class="range" id="range" role="group" aria-label="Time range"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<footer class="wrap muted" id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
